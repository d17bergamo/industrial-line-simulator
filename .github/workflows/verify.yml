name: Verifica rapida (motore e test)

# Compila e collauda solo i progetti senza WPF (Linux): feedback veloce a ogni push sui branch di lavoro.
# Il build completo con WPF, EXE e installer resta nel workflow "Build, test e pubblicazione" (pull request e main).

on:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test (motore, ottimizzazione, infrastruttura)
        env:
          PDF_PREVIEW_DIR: ${{ github.workspace }}/anteprime
        run: dotnet test IndustrialLineSimulator.Core.slnx -c Release --logger "console;verbosity=normal"

      # PDF di prova (vista dall'alto, ciclogramma Gantt) degli esempi: release "anteprime-pdf", non pesa sulla quota artefatti
      - name: Pubblica le anteprime PDF
        if: always() && hashFiles('anteprime/*.pdf') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete anteprime-pdf --yes --cleanup-tag || true
          gh release create anteprime-pdf anteprime/*.pdf --target "${{ github.sha }}" --prerelease \
            --title "Anteprime PDF (${{ github.ref_name }})" --notes "PDF di prova generati dai test sugli esempi, ramo ${{ github.ref_name }}, commit ${{ github.sha }}."
