name: Build, test e pubblicazione

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IndustrialLineSimulator.slnx

      - name: Build
        run: dotnet build IndustrialLineSimulator.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/LineSimulator.Tests/LineSimulator.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Pubblica risultati dei test
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: TestResults
          retention-days: 14

      - name: Publish EXE self-contained (win-x64, file singolo)
        run: >
          dotnet publish src/LineSimulator.App/LineSimulator.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/IndustrialLineSimulator

      - name: Crea pacchetto ZIP (cartella di distribuzione)
        shell: pwsh
        run: |
          Copy-Item README.md publish/IndustrialLineSimulator/
          Compress-Archive -Path publish/IndustrialLineSimulator/* -DestinationPath publish/IndustrialLineSimulator-win-x64.zip -Force

      - name: Installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.3.0 /DSourceDir="$pwd\publish\IndustrialLineSimulator" /O"$pwd\publish" installer\LineSimulator.iss

      # Artefatto della run (può mancare se la quota di archiviazione è piena: il programma resta nella release "ultima-build")
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: IndustrialLineSimulator-win-x64
          path: |
            publish/IndustrialLineSimulator-win-x64.zip
            publish/*Setup*.exe
          retention-days: 14

      # Release fissa con l'ultimo programma di main: sempre scaricabile, non pesa sulla quota degli artefatti
      - name: Release "ultima-build" (solo main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-build --yes --cleanup-tag 2>$null
          $files = @("publish/IndustrialLineSimulator-win-x64.zip") + (Get-ChildItem publish/*Setup*.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          gh release create ultima-build $files --target "${{ github.sha }}" --prerelease --title "Ultima build di main" --notes "Programma generato automaticamente da main, commit ${{ github.sha }}. Scarica lo ZIP (exe portabile) o il Setup."

      - name: Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/IndustrialLineSimulator-win-x64.zip
            publish/*Setup*.exe
