name: Build, test e pubblicazione

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IndustrialLineSimulator.slnx

      - name: Build
        run: dotnet build IndustrialLineSimulator.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/LineSimulator.Tests/LineSimulator.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Pubblica risultati dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish EXE self-contained (win-x64, file singolo)
        run: >
          dotnet publish src/LineSimulator.App/LineSimulator.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/IndustrialLineSimulator

      - name: Crea pacchetto ZIP (cartella di distribuzione)
        shell: pwsh
        run: |
          Copy-Item README.md publish/IndustrialLineSimulator/
          Compress-Archive -Path publish/IndustrialLineSimulator/* -DestinationPath publish/IndustrialLineSimulator-win-x64.zip -Force

      - name: Installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.2.0 /DSourceDir="$pwd\publish\IndustrialLineSimulator" /O"$pwd\publish" installer\LineSimulator.iss

      - uses: actions/upload-artifact@v4
        with:
          name: IndustrialLineSimulator-win-x64
          path: |
            publish/IndustrialLineSimulator-win-x64.zip
            publish/*Setup*.exe

      - name: Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/IndustrialLineSimulator-win-x64.zip
            publish/*Setup*.exe
