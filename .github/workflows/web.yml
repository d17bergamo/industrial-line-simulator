name: Versione web

# Compila la versione web (gira nel browser, anche del telefono, senza installazione), la prova con un browser da
# telefono e pubblica il pacchetto e le schermate nella prerelease "web-anteprima".
# Da main (2026-11-18) pubblica anche il sito pubblico: solo la pagina compilata, nel ramo gh-pages del repository
# pubblico d17bergamo/simulatore-linea-web (GitHub Pages). Serve il segreto WEB_SITE_TOKEN: token con permesso
# "Contents: read and write" sul solo repository pubblico. Senza segreto il passo viene saltato.

on:
  push:
    paths: [ 'src/**', 'tools/web-*', '.github/workflows/web.yml' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      WEB_SITE_TOKEN: ${{ secrets.WEB_SITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pubblica la versione web
        run: |
          dotnet workload install wasm-tools > /dev/null
          dotnet publish src/LineSimulator.Web/LineSimulator.Web.csproj -c Release -o out
          python3 tools/web-pack.py out/wwwroot
          mkdir -p web
          (cd out/wwwroot && zip -q -r ../../web/simulatore-web.zip . && find . -type f -printf '%s %p\n' | sort -k2 > ../../web/web-file.txt)
          du -sh out/wwwroot

      - name: Prova con un browser da telefono
        run: |
          mkdir -p prova && cd prova
          npm init -y > /dev/null
          npm install playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          python3 -m http.server 8377 -d ../out/wwwroot > /dev/null 2>&1 &
          sleep 2
          cp ../tools/web-check.mjs . && node web-check.mjs http://localhost:8377/index.html ../web

      - name: Pubblica pacchetto e schermate
        if: always() && hashFiles('web/*') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete web-anteprima --yes --cleanup-tag || true
          gh release create web-anteprima web/* --target "${{ github.sha }}" --prerelease \
            --title "Versione web (${{ github.ref_name }})" --notes "Pacchetto della versione web e schermate della prova, ramo ${{ github.ref_name }}, commit ${{ github.sha }}."

      - name: Pubblica il sito pubblico (GitHub Pages)
        if: github.ref == 'refs/heads/main' && env.WEB_SITE_TOKEN != ''
        run: |
          rm -rf sito && cp -r out/wwwroot sito && touch sito/.nojekyll
          cd sito
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Simulatore Linea - versione web dal commit ${{ github.sha }}"
          git push -q -f "https://x-access-token:${WEB_SITE_TOKEN}@github.com/d17bergamo/simulatore-linea-web.git" gh-pages
          echo "Sito aggiornato: https://d17bergamo.github.io/simulatore-linea-web/"
